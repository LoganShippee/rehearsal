<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b2f"/><stop offset="1" stop-color="#0c0c18"/></linearGradient>
    <linearGradient id="wk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f5f0"/><stop offset="1" stop-color="#cfcfc6"/></linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a30"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient>
    <pattern id="white" width="100" height="360" patternUnits="userSpaceOnUse"><rect x="2" width="96" height="360" rx="0 0 8 8" fill="url(#wk)"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="540" width="1600" height="360" fill="url(#white)"/>
  <!-- black keys in the usual 2 + 3 grouping, repeating every 7 white keys (700px) -->
  <g id="oct" fill="url(#bk)">
    <rect x="70" y="540" width="60" height="215" rx="0 0 5 5"/><rect x="170" y="540" width="60" height="215"/>
    <rect x="370" y="540" width="60" height="215"/><rect x="470" y="540" width="60" height="215"/><rect x="570" y="540" width="60" height="215"/>
  </g>
  <use href="#oct" x="700"/><use href="#oct" x="1400"/><use href="#oct" x="-700"/>
  <rect y="525" width="1600" height="18" fill="#7c1d2b"/>
</svg>
