<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Rhythm Dash — Rehearsal</title>
  <style>
    :root {
      --background: #0d111d;
      --card: #151b2c;
      --card-border: #26314a;
      --border: #2e3b59;
      --foreground: #e6edf7;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #071320;
      --accent: #a78bfa;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #fb7185;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body { padding: 10px 12px; max-width: 980px; margin: 0 auto; }
    button, select, input { font: inherit; color: inherit; }
    button { background: transparent; border: 0; }
    select { background: var(--card); color: var(--foreground); }
    #gameCanvas, #notationCanvas, #touchPad {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #touchPad.is-down {
      background: var(--primary) !important;
      color: var(--primary-foreground) !important;
      border-color: var(--primary) !important;
      transform: scale(0.992);
    }

    /* Self-contained offline utility classes (zero external CDN required) */
    .hidden { display: none !important; }
    .block { display: block; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .grid { display: grid; }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 640px) { .sm\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-y-0 { top: 0; bottom: 0; }
    .top-0\.5 { top: 2px; }
    .bottom-0\.5 { bottom: 2px; }
    .left-1\/2 { left: 50%; }
    .left-\[38\%\] { left: 38%; }
    .right-\[38\%\] { right: 38%; }
    .overflow-hidden { overflow: hidden; }
    .cursor-pointer { cursor: pointer; }
    .cursor-not-allowed { cursor: not-allowed; }
    .select-none { user-select: none; -webkit-user-select: none; }
    .touch-none { touch-action: none; }
    .antialiased { -webkit-font-smoothing: antialiased; }
    .transition { transition: all 120ms ease; }
    .transition-all { transition: all 120ms ease; }
    .transition-colors { transition: color 150ms ease, background-color 150ms ease, border-color 150ms ease; }
    .duration-75 { transition-duration: 75ms; }
    .duration-300 { transition-duration: 300ms; }
    .focus\:outline-none:focus { outline: none; }
    .hover\:opacity-85:hover { opacity: 0.85; }
    .hover\:opacity-90:hover { opacity: 0.90; }
    .hover\:border-\[var\(--primary\)\]:hover { border-color: var(--primary); }
    .hover\:text-\[var\(--foreground\)\]:hover { color: var(--foreground); }

    .m-0 { margin: 0; }
    .p-0 { padding: 0; }
    .p-1\.5 { padding: 6px; }
    .p-2 { padding: 8px; }
    .px-1 { padding-left: 4px; padding-right: 4px; }
    .px-1\.5 { padding-left: 6px; padding-right: 6px; }
    .px-2 { padding-left: 8px; padding-right: 8px; }
    .px-3 { padding-left: 12px; padding-right: 12px; }
    .py-0\.5 { padding-top: 2px; padding-bottom: 2px; }
    .py-1 { padding-top: 4px; padding-bottom: 4px; }
    .py-2\.5 { padding-top: 10px; padding-bottom: 10px; }
    .pb-1 { padding-bottom: 4px; }
    .pb-1\.5 { padding-bottom: 6px; }
    .pt-1\.5 { padding-top: 6px; }
    .ml-1 { margin-left: 4px; }
    .mr-1 { margin-right: 4px; }
    .mt-0\.5 { margin-top: 2px; }
    .gap-0\.5 { gap: 2px; }
    .gap-1 { gap: 4px; }
    .gap-1\.5 { gap: 6px; }
    .gap-2 { gap: 8px; }
    .gap-2\.5 { gap: 10px; }
    .gap-3 { gap: 12px; }
    .space-y-1 > * + * { margin-top: 4px; }
    .space-y-1\.5 > * + * { margin-top: 6px; }
    .space-y-2 > * + * { margin-top: 8px; }

    .w-px { width: 1px; }
    .w-2 { width: 8px; }
    .w-4 { width: 16px; }
    .w-20 { width: 80px; }
    .w-24 { width: 96px; }
    .w-28 { width: 112px; }
    .w-full { width: 100%; }
    .h-2 { height: 8px; }
    .h-2\.5 { height: 10px; }
    .h-full { height: 100%; }
    .min-w-\[30px\] { min-width: 30px; }
    .min-w-\[44px\] { min-width: 44px; }
    .min-w-\[46px\] { min-width: 46px; }

    .rounded { border-radius: 6px; }
    .rounded-full { border-radius: 9999px; }
    .border { border: 1px solid var(--border); }
    .border-b { border-bottom: 1px solid var(--card-border); }
    .border-t { border-top: 1px solid var(--card-border); }
    .border-\[var\(--border\)\] { border-color: var(--border); }
    .border-\[var\(--card-border\)\] { border-color: var(--card-border); }
    .border-\[var\(--primary\)\] { border-color: var(--primary); }
    .divide-y > * + * { border-top: 1px solid var(--card-border); }
    .divide-\[var\(--card-border\)\] > * + * { border-top-color: var(--card-border); }

    .bg-transparent { background-color: transparent; }
    .bg-\[var\(--background\)\] { background-color: var(--background); }
    .bg-\[var\(--card\)\] { background-color: var(--card); }
    .bg-\[var\(--foreground\)\] { background-color: var(--foreground); }
    .bg-\[var\(--primary\)\] { background-color: var(--primary); }
    .bg-\[var\(--success\)\] { background-color: var(--success); }
    .bg-\[var\(--warning\)\] { background-color: var(--warning); }
    .bg-emerald-500\/20 { background-color: rgba(16, 185, 129, 0.2); }
    .bg-sky-500\/20 { background-color: rgba(14, 165, 233, 0.2); }
    .bg-zinc-500\/20 { background-color: rgba(113, 113, 122, 0.2); }

    .text-left { text-align: left; }
    .text-xs { font-size: 12px; line-height: 16px; }
    .text-\[10px\] { font-size: 10px; line-height: 14px; }
    .text-\[11px\] { font-size: 11px; line-height: 15px; }
    .font-normal { font-weight: 400; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .uppercase { text-transform: uppercase; }
    .tracking-wide { letter-spacing: 0.025em; }
    .tracking-wider { letter-spacing: 0.05em; }
    .opacity-25 { opacity: 0.25; }
    .opacity-45 { opacity: 0.45; }
    .text-\[var\(--foreground\)\] { color: var(--foreground); }
    .text-\[var\(--muted-foreground\)\] { color: var(--muted-foreground); }
    .text-\[var\(--primary\)\] { color: var(--primary); }
    .text-\[var\(--primary-foreground\)\] { color: var(--primary-foreground); }
    .text-\[var\(--success\)\] { color: var(--success); }
    .text-\[var\(--warning\)\] { color: var(--warning); }
    .text-\[\#090d18\] { color: #090d18; }
    .text-emerald-300 { color: #6ee7b7; }
    .text-sky-300 { color: #7dd3fc; }
    .text-zinc-400 { color: #a1a1aa; }
    .accent-\[var\(--primary\)\] { accent-color: var(--primary); }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-1 space-y-1.5">
    <!-- Row 1: Speed Difficulty, Portal Mode Roulette, Active Badge, HUD, Start/Stop -->
    <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
      <div class="flex flex-wrap items-center gap-1.5">
        <select id="speedSelect" class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded px-2 py-1 text-xs font-medium focus:outline-none">
          <option value="chill">Start: Chill (72+ BPM)</option>
          <option value="steady" selected>Start: Steady (86+ BPM)</option>
          <option value="brisk">Start: Brisk (102+ BPM)</option>
          <option value="hyper">Start: Hyper (118+ BPM)</option>
        </select>

        <select id="rouletteSelect" class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded px-2 py-1 text-xs font-medium focus:outline-none">
          <option value="random">Portal Mode: 🎲 Random</option>
          <option value="live">Lock: Live Sight</option>
          <option value="blind">Lock: Pure Sight (Hidden Track)</option>
          <option value="track">Lock: Track Only (No Notation)</option>
          <option value="echo">Lock: Memory Echo (1-Bar)</option>
          <option value="turbo">Lock: Turbo Dash (4-Bar Fast)</option>
          <option value="overdrive">Mode: 🔥 Endless Overdrive</option>
          <option value="stream">Mode: ∞ Endless Stream</option>
        </select>

        <span id="activeModeBadge" class="px-2 py-0.5 rounded border text-[11px] font-bold tracking-wide">
          LIVE SIGHT
        </span>
      </div>

      <div class="flex items-center gap-2.5">
        <div class="flex items-center gap-2 font-mono tabular-nums">
          <span class="text-[var(--muted-foreground)]"><strong id="bpmHud" class="text-[var(--foreground)]">86</strong> BPM</span>
          <span class="text-[var(--muted-foreground)]">Acc <strong id="accHud" class="text-[var(--foreground)]">100%</strong></span>
          <span class="text-[var(--muted-foreground)]">Streak <strong id="streakHud" class="text-[var(--success)]">0</strong></span>
          <span id="layerPills" class="inline-flex items-center gap-0.5" title="Adaptive Band Layers (unlocks Bass at 5, Chords at 10, Arp at 15 streak)">
            <span class="px-1 rounded border text-[10px] font-bold">D</span>
            <span class="px-1 rounded border text-[10px] font-bold">B</span>
            <span class="px-1 rounded border text-[10px] font-bold">C</span>
            <span class="px-1 rounded border text-[10px] font-bold">A</span>
          </span>
          <span class="text-[var(--muted-foreground)]">Portals <strong id="portalHud" class="text-[var(--primary)]">0</strong></span>
          <span class="text-[var(--muted-foreground)]">Score <strong id="scoreHud" class="text-[var(--warning)]">0</strong></span>
          <span id="readMultBadge" class="hidden px-1.5 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] text-[10px] font-bold">READ ×1</span>
        </div>
        <button id="playBtn" type="button" class="px-3 py-1 rounded font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 transition cursor-pointer">
          Start
        </button>
      </div>
    </div>

    <!-- Row 2: Collapsible Menus (Meter & Rhythms, Worlds & Skins, Class Board) + Groove & Gameplay Toggles -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-1 border-b border-[var(--card-border)] text-xs">
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="menuToggleBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--primary)] bg-[var(--card)] text-[var(--foreground)] font-medium hover:opacity-85 transition cursor-pointer" title="Open full Meter, Counting & Rhythms menu (from Rehearsal Sight Reading)">
          ⚙ <span id="menuSummary">4/4 · 5 rhythms</span> <span id="menuCaret">▾</span>
        </button>
        <button id="worldsToggleBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium hover:border-[var(--primary)] transition cursor-pointer" title="8 Curriculum Worlds, 3-Star Mastery, and Unlockable Cube Skins & Trails">
          🗺 Worlds <span id="starsSummary" class="text-[var(--warning)] font-bold">★0</span>
        </button>
        <button id="boardToggleBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-medium hover:border-[var(--primary)] transition cursor-pointer" title="Class-Scoped Leaderboard, Weekly Seeded Challenge & Co-op Goal">
          🏆 Board
        </button>
        <select id="grooveSelect" class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded px-1.5 py-0.5 text-xs font-medium focus:outline-none" title="Choose Web Audio backing groove style">
          <option value="electro" selected>Groove: GD Electro</option>
          <option value="funk">Groove: Funky Pocket</option>
          <option value="lofi">Groove: Lo-Fi Chill</option>
          <option value="rock">Groove: Driving Rock</option>
          <option value="march">Groove: Drumline</option>
          <option value="chiptune">Groove: 8-Bit Chip</option>
          <option value="jazz">Groove: Jazz Swing</option>
          <option value="click">Audio: Click Only</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <button id="readModeBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-85 transition cursor-pointer" title="Tricks = fake spikes on rests, pop-up stealth spikes, and mist-end holds (forces reading!); Pure = fog curtain hides all obstacles; Visual = open track">
          Read: <span id="readModeLabel" class="font-semibold text-[var(--primary)]">Tricks</span>
        </button>
        <button id="playheadBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-85 transition cursor-pointer" title="Difficulty setting: hide the scrolling playhead on the staff (+25% score) so students track the beat with their eyes">
          Playhead: <span id="playheadLabel" class="font-semibold text-[var(--success)]">On</span>
        </button>
        <button id="longModeBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-85 transition cursor-pointer" title="Hold = hold long glide rails until near the end (release early = crash!); Tap = single-tap auto-glide">
          Long: <span id="longModeLabel" class="font-semibold text-[var(--warning)]">Hold</span>
        </button>
        <button id="restartBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] hover:opacity-85 transition cursor-pointer" title="Auto-restart current pattern on mistake vs Keep Going">
          On Miss: <span id="restartLabel" class="font-semibold text-[var(--warning)]">Restart</span>
        </button>
        <label class="flex items-center gap-1 text-[var(--muted-foreground)] cursor-pointer">
          <input id="countsToggle" type="checkbox" checked class="accent-[var(--primary)] rounded cursor-pointer" />
          <span>Counts</span>
        </label>
      </div>
    </div>

    <!-- Collapsible Full Sight-Reading Meter & Rhythms Panel (borrowed from Rehearsal web/sight.js) -->
    <div id="rhythmMenuPanel" class="hidden rounded border border-[var(--card-border)] bg-[var(--card)] p-2 space-y-1.5 text-xs">
      <div class="flex flex-wrap items-center justify-between gap-2 pb-1.5 border-b border-[var(--card-border)]">
        <div class="flex flex-wrap items-center gap-2">
          <span class="font-semibold text-[var(--foreground)]">Meter &amp; Counting</span>
          <label class="flex items-center gap-1 text-[var(--muted-foreground)]">Time
            <select id="tsSelect" class="bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] rounded px-1.5 py-0.5 text-xs">
              <option value="2/4">2/4</option>
              <option value="3/4">3/4</option>
              <option value="4/4" selected>4/4</option>
              <option value="6/8">6/8</option>
              <option value="9/8">9/8</option>
              <option value="12/8">12/8</option>
            </select>
          </label>
          <label class="flex items-center gap-1 text-[var(--muted-foreground)]">Counts
            <select id="rhySysSelect" class="bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] rounded px-1.5 py-0.5 text-xs">
              <option value="numbers" selected>Numbers (1 e &amp; a)</option>
              <option value="kodaly">Kodály (ta ti-ti)</option>
              <option value="takadimi">Takadimi (ta ta-di)</option>
            </select>
          </label>
          <label class="flex items-center gap-1 text-[var(--muted-foreground)] cursor-pointer" title="Hold a note across the bar line with a tie">
            <input id="tiesToggle" type="checkbox" class="accent-[var(--primary)] rounded cursor-pointer" />
            <span>Tied notes</span>
          </label>
        </div>
        <div class="flex flex-wrap items-center gap-1" id="presetBar">
          <span class="text-[var(--muted-foreground)]">Presets:</span>
          <button type="button" data-preset="basic" class="px-1.5 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)] cursor-pointer">Basic</button>
          <button type="button" data-preset="eighths" class="px-1.5 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)] cursor-pointer">Eighths &amp; Rests</button>
          <button type="button" data-preset="dotted" class="px-1.5 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)] cursor-pointer">Dotted &amp; Sync</button>
          <button type="button" data-preset="sixteenths" class="px-1.5 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)] cursor-pointer">16ths &amp; Triplets</button>
          <button type="button" data-preset="compound" class="px-1.5 py-0.5 rounded border border-[var(--border)] hover:border-[var(--primary)] cursor-pointer">6/8 Compound</button>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-1" id="rhythmChips"></div>
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-[var(--card-border)] text-[11px] text-[var(--muted-foreground)]">
        <div class="flex flex-wrap items-center gap-2">
          <label class="flex items-center gap-1" title="Compensate for Bluetooth / speaker audio latency">
            <span>Audio sync</span>
            <input id="avOffsetSlider" type="range" min="-150" max="250" step="5" value="0" class="w-24 accent-[var(--primary)] cursor-pointer" />
            <strong id="avOffsetVal" class="font-mono text-[var(--foreground)] min-w-[44px]">0 ms</strong>
          </label>
          <button id="avCalBtn" type="button" class="px-1.5 py-0.5 rounded border border-[var(--border)] text-[var(--foreground)] hover:border-[var(--primary)] cursor-pointer" title="Tap along with 4 clicks to auto-calibrate audio latency">Calibrate…</button>
        </div>
        <label class="flex items-center gap-1" title="Master volume (through soft limiter)">
          <span>Vol</span>
          <input id="volSlider" type="range" min="0" max="100" step="5" value="85" class="w-20 accent-[var(--primary)] cursor-pointer" />
          <strong id="volVal" class="font-mono text-[var(--foreground)] min-w-[30px]">85%</strong>
        </label>
      </div>
    </div>

    <!-- Collapsible Curriculum Worlds & Skins/Trails Panel -->
    <div id="worldsPanel" class="hidden rounded border border-[var(--card-border)] bg-[var(--card)] p-2 space-y-2 text-xs">
      <div class="flex flex-wrap items-center justify-between gap-2 pb-1.5 border-b border-[var(--card-border)]">
        <div class="flex items-center gap-1.5">
          <button id="tabWorldsBtn" type="button" class="px-2 py-0.5 rounded font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] cursor-pointer">8 Curriculum Worlds</button>
          <button id="tabSkinsBtn" type="button" class="px-2 py-0.5 rounded border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] cursor-pointer">🎨 Skins &amp; Trails</button>
        </div>
        <div class="flex items-center gap-2 text-[11px] text-[var(--muted-foreground)]">
          <span>Mastery: <strong id="totalStarsLabel" class="text-[var(--warning)]">★ 0 / 24</strong></span>
          <label class="flex items-center gap-1 cursor-pointer" title="Unlock all skins & trails for teacher preview">
            <input id="previewUnlockToggle" type="checkbox" class="accent-[var(--primary)] cursor-pointer" />
            <span>Preview all</span>
          </label>
        </div>
      </div>
      <div id="worldsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-1.5"></div>
      <div id="skinsArea" class="hidden space-y-2">
        <div class="flex flex-wrap items-center gap-1.5" id="skinsRow"></div>
        <div class="flex flex-wrap items-center gap-1.5" id="trailsRow"></div>
      </div>
    </div>

    <!-- Collapsible Class Leaderboard, Weekly Seeded Challenge & Co-op Goal Panel -->
    <div id="boardPanel" class="hidden rounded border border-[var(--card-border)] bg-[var(--card)] p-2 space-y-2 text-xs">
      <div class="flex flex-wrap items-center justify-between gap-2 pb-1.5 border-b border-[var(--card-border)]">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="font-semibold text-[var(--foreground)]">🏆 Class Board</span>
          <select id="boardCatSelect" class="bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] rounded px-1.5 py-0.5 text-[11px] font-medium focus:outline-none" title="View leaderboard for a specific World, Weekly Seed, or Free Play">
            <option value="weekly">⚡ Weekly Seed</option>
            <option value="w1">W1 · Pulse City (4/4)</option>
            <option value="w2" selected>W2 · Eighth Alley (4/4)</option>
            <option value="w3">W3 · Waltz Heights (3/4)</option>
            <option value="w4">W4 · Syncopation Station</option>
            <option value="w5">W5 · Subdivision Lab (16ths)</option>
            <option value="w6">W6 · Triplet Nebula</option>
            <option value="w7">W7 · Compound Canyon (6/8)</option>
            <option value="w8">W8 · Overdrive Summit</option>
            <option value="custom">Free Play / Custom</option>
          </select>
          <button id="boardPlayCatBtn" type="button" class="px-2 py-0.5 rounded font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 cursor-pointer">Play</button>
          <button id="weeklyBtn" type="button" class="px-2 py-0.5 rounded font-semibold bg-[var(--warning)] text-[#090d18] hover:opacity-90 cursor-pointer" title="Every student plays the exact same seeded 4-bar course this week">⚡ Weekly Seed</button>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="privacyToggleBtn" type="button" class="px-1.5 py-0.5 rounded border border-[var(--border)] text-[11px] text-[var(--muted-foreground)] hover:text-[var(--foreground)] cursor-pointer" title="Switch FERPA-safe display style">Names: <span id="privacyLabel" class="text-[var(--foreground)] font-semibold">First + Initial</span></button>
        </div>
      </div>
      <!-- Class Cooperative Goal -->
      <div class="space-y-1">
        <div class="flex items-center justify-between text-[11px]">
          <span class="text-[var(--muted-foreground)]">Class Co-op Goal: <strong class="text-[var(--foreground)]">Clear 500 Portals This Week</strong></span>
          <span id="coopCountLabel" class="font-mono text-[var(--success)] font-semibold">342 / 500</span>
        </div>
        <div class="w-full h-2 rounded-full bg-[var(--background)] border border-[var(--border)] overflow-hidden">
          <div id="coopBar" class="h-full bg-[var(--success)] transition-all duration-300" style="width: 68.4%;"></div>
        </div>
      </div>
      <!-- Leaderboard Table -->
      <div id="boardRows" class="divide-y divide-[var(--card-border)] text-[11px]"></div>
    </div>

    <!-- Continuous Forward Side-Scrolling Geometry Dash Course -->
    <div class="w-full rounded border border-[var(--card-border)] bg-[var(--card)] overflow-hidden">
      <canvas id="gameCanvas" class="block w-full cursor-pointer touch-none" style="height: 194px;"></canvas>
    </div>

    <!-- Synced Western Notation Strip (Anchored at Bottom) -->
    <div class="w-full rounded border border-[var(--card-border)] bg-[var(--card)] overflow-hidden transition-colors" id="notationWrap">
      <canvas id="notationCanvas" class="block w-full cursor-pointer touch-none" style="height: 96px;"></canvas>
    </div>

    <!-- Dedicated Touch / Tap & Hold Pad (phones, iPads, touchscreen Chromebooks & desktop click) -->
    <button id="touchPad" type="button" class="w-full py-2.5 rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] font-bold text-xs tracking-wider uppercase transition cursor-pointer" aria-label="Tap or hold to jump">
      TAP / HOLD TO JUMP <span class="font-normal text-[var(--muted-foreground)] ml-1">(or Space / ↑)</span>
    </button>

    <!-- Bottom Strip: Live Early / Perfect / Late Timing Meter + Status -->
    <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-[var(--muted-foreground)]">
      <div class="flex items-center gap-2">
        <span class="text-[11px]">Early</span>
        <div class="relative w-28 h-2.5 rounded-full bg-[var(--card)] border border-[var(--border)] overflow-hidden" title="Live Timing Meter: Center is dead on the beat">
          <div class="absolute inset-y-0 left-[38%] right-[38%] bg-[var(--success)] opacity-25"></div>
          <div class="absolute inset-y-0 left-1/2 w-px bg-[var(--foreground)] opacity-45"></div>
          <div id="timingPip" class="absolute top-0.5 bottom-0.5 w-2 rounded-full bg-[var(--primary)] transition-all duration-75" style="left: calc(50% - 4px);"></div>
        </div>
        <span class="text-[11px]">Late</span>
        <span id="timingReadout" class="font-mono tabular-nums text-[var(--foreground)] min-w-[46px]">0 ms</span>
      </div>
      <span id="statusText" class="font-mono text-[var(--foreground)]">Ready · Tap or press Space</span>
    </div>
  </div>
  <script src="rhythm-dash.js"></script>
</body>
</html>
