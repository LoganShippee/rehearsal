<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rehearsal — Complete Google Sign-In</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root {
    --bg: #eef2f8;
    --card: #ffffff;
    --ink: #161d29;
    --muted: #5a6477;
    --line: #d6deeb;
    --accent: #2c5be0;
    --ok-bg: #eaf7ef;
    --ok-ink: #16653b;
    --err-bg: #fdeeee;
    --err-ink: #a22a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151d;
      --card: #191f2b;
      --ink: #eaedf4;
      --muted: #9ca6ba;
      --line: #2c3445;
      --accent: #6b93ff;
      --ok-bg: #122d20;
      --ok-ink: #7ce2a7;
      --err-bg: #361a1a;
      --err-ink: #f79e9e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
  }
  .brand img { width: 28px; height: 28px; border-radius: 6px; }
  h1 { margin: 0; font-size: 20px; line-height: 1.3; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .status {
    padding: 11px 13px;
    border-radius: 9px;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: rgba(127, 127, 127, 0.06);
  }
  .status.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; font-weight: 600; }
  .status.err { background: var(--err-bg); color: var(--err-ink); border-color: transparent; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  #gsi-btn-host { display: flex; justify-content: center; min-height: 44px; }
</style>
</head>
<body>
  <main class="card" id="oauth-card">
    <div class="brand">
      <img src="icon-192.png" alt="Rehearsal">
      <span>Rehearsal Online Homework</span>
    </div>
    <h1 id="oauth-title">Finish Signing In to Rehearsal</h1>
    <p class="muted" id="oauth-desc">Confirm Google Sign-In below, then return to the Rehearsal app.</p>
    <div class="status" id="oauth-status">Checking sign-in link…</div>
    <div id="gsi-btn-host" hidden></div>
    <div id="oauth-actions" style="display:flex;flex-direction:column;gap:8px"></div>
    <p class="muted" style="font-size:12px">Need privacy details? <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></p>
  </main>

<script>
(function () {
  'use strict';
  const DEFAULT_API_BASE = 'https://rehearsal-hw.logan-shippee.workers.dev';
  const DEMO_HANDOFFS_KEY = 'rehearsal-hw-demo-handoffs-v1';
  const qs = new URLSearchParams(location.search || '');
  const state = (qs.get('state') || '').trim();
  const rawApi = qs.has('api') ? (qs.get('api') || '').trim().replace(/\/+$/, '') : null;
  const googleClientId = (qs.get('googleClientId') || '').trim();
  const isDemo = qs.get('demo') === '1' || rawApi === '' || (!!rawApi && rawApi.toLowerCase() === 'demo');
  const apiBase = isDemo ? '' : (rawApi || DEFAULT_API_BASE);
  const isDev = qs.get('dev') === '1';

  const titleEl = document.getElementById('oauth-title');
  const descEl = document.getElementById('oauth-desc');
  const statusEl = document.getElementById('oauth-status');
  const gsiHost = document.getElementById('gsi-btn-host');
  const actionsEl = document.getElementById('oauth-actions');
  let timer = null;
  let completed = false;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function clearTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function showSuccess(emailLabel) {
    completed = true;
    clearTimer();
    gsiHost.hidden = true;
    actionsEl.innerHTML = '';
    titleEl.textContent = 'Signed in!';
    descEl.textContent = emailLabel
      ? `Signed in as ${emailLabel}. You can close this browser tab and return to Rehearsal.`
      : 'You can close this browser tab and return to Rehearsal.';
    setStatus('Signed in! Return to Rehearsal — it will open your workspace automatically.', 'ok');
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn';
    closeBtn.textContent = 'Close This Tab';
    closeBtn.onclick = () => { try { window.close(); } catch { } };
    actionsEl.appendChild(closeBtn);
  }

  function startCountdown(expiresAtMs) {
    clearTimer();
    const tick = () => {
      if (completed) return clearTimer();
      const left = Math.max(0, Math.ceil((expiresAtMs - Date.now()) / 1000));
      if (left <= 0) {
        clearTimer();
        gsiHost.hidden = true;
        actionsEl.innerHTML = '';
        setStatus('This sign-in link expired after 60 seconds. Start again in Rehearsal.', 'err');
        return;
      }
      setStatus(`Link active for ${left}s — choose your Google account to finish signing in.`, '');
    };
    tick();
    timer = setInterval(tick, 1000);
  }

  if (!state) {
    titleEl.textContent = 'Missing Sign-In Link';
    descEl.textContent = 'Open this page from the "Sign in with Google" button inside Rehearsal.';
    setStatus('Missing OAuth state parameter. Return to Rehearsal and try again.', 'err');
    return;
  }

  // ---------- Local Preview Mode handoff
  if (isDemo) {
    titleEl.textContent = 'Finish Signing In (Local Preview)';
    descEl.textContent = 'Click below to complete the 60-second desktop browser OAuth handoff back to Rehearsal.';
    let map = {};
    try { map = JSON.parse(localStorage.getItem(DEMO_HANDOFFS_KEY) || '{}') || {}; } catch { map = {}; }
    const entry = map[state];
    if (!entry || (entry.expiresAt && entry.expiresAt <= Date.now())) {
      setStatus('This preview sign-in link expired. Click Sign in with Google again in Rehearsal.', 'err');
      return;
    }
    startCountdown(entry.expiresAt || (Date.now() + 60000));

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn primary';
    btn.textContent = 'Complete Google Sign-In as Ms. Rivera';
    btn.onclick = () => {
      let curMap = {};
      try { curMap = JSON.parse(localStorage.getItem(DEMO_HANDOFFS_KEY) || '{}') || {}; } catch { curMap = {}; }
      const item = curMap[state];
      if (!item || (item.expiresAt && item.expiresAt <= Date.now())) {
        clearTimer();
        setStatus('This preview sign-in link expired. Start again in Rehearsal.', 'err');
        btn.disabled = true;
        return;
      }
      item.status = 'complete';
      item.completedAt = Date.now();
      item.teacherEmail = 'ms.rivera@oakridge.edu';
      item.teacherName = 'Ms. Rivera';
      curMap[state] = item;
      try { localStorage.setItem(DEMO_HANDOFFS_KEY, JSON.stringify(curMap)); } catch { }
      showSuccess('Ms. Rivera (ms.rivera@oakridge.edu)');
    };
    actionsEl.appendChild(btn);
    return;
  }

  // ---------- Live Cloudflare Worker handoff
  startCountdown(Date.now() + 60000);

  async function submitIdToken(idToken, label) {
    setStatus('Completing sign-in…', '');
    try {
      const res = await fetch(`${apiBase}/api/auth/teacher/oauth/complete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state, idToken }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        setStatus(data.error || 'Could not complete sign-in. Return to Rehearsal and try again.', 'err');
        return;
      }
      showSuccess(label || '');
    } catch {
      setStatus('Network error contacting Rehearsal Homework server.', 'err');
    }
  }

  if (googleClientId) {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = () => {
      try {
        if (!window.google?.accounts?.id) {
          setStatus('Google Sign-In could not load on this network.', 'err');
          return;
        }
        window.google.accounts.id.initialize({
          client_id: googleClientId,
          callback: resp => {
            if (resp && resp.credential) submitIdToken(resp.credential, '');
          },
        });
        gsiHost.hidden = false;
        window.google.accounts.id.renderButton(gsiHost, {
          theme: 'outline',
          size: 'large',
          width: 340,
          text: 'signin_with',
        });
      } catch {
        setStatus('Google Sign-In failed to initialize.', 'err');
      }
    };
    s.onerror = () => setStatus('Could not load Google Sign-In script (check network/allowlist).', 'err');
    document.head.appendChild(s);
  } else if (!isDev) {
    setStatus('No Google Client ID configured on this sign-in link. Use the 6-digit email code in Rehearsal instead.', 'err');
  }

  if (isDev) {
    const devBtn = document.createElement('button');
    devBtn.type = 'button';
    devBtn.className = 'btn';
    devBtn.textContent = 'Complete Dev-Mode Google Sign-In';
    devBtn.onclick = () => submitIdToken('dev-google:dev-desktop|teacher@school.edu|Ms. Rivera', 'teacher@school.edu');
    actionsEl.appendChild(devBtn);
  }
})();
</script>
</body>
</html>
